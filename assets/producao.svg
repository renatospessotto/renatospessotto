<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Resultados em produção na Cognitivo.ai">
<rect width="1200" height="150" fill="#0a0a0a"/>
<rect width="1200" height="150" fill="none" stroke="#1f3354" stroke-width="2"/>
<text x="28" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#f2f4f7">10x</text>
<text x="28" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#9aa4b2">custo das consultas no Athena</text>
<text x="28" y="121" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#9aa4b2">(Iceberg + Z-Order no S3)</text>
<rect x="300" y="24" width="1" height="102" fill="#1f3354"/>
<text x="328" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#f2f4f7">5s → 1s</text>
<text x="328" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#9aa4b2">tempo de resposta das consultas</text>
<text x="328" y="121" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#9aa4b2">(1 GB → 100 MB por cliente)</text>
<rect x="600" y="24" width="1" height="102" fill="#1f3354"/>
<text x="628" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#f2f4f7">30–45 min</text>
<text x="628" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#9aa4b2">poupados por reunião</text>
<text x="628" y="121" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#9aa4b2">(transcrição → tarefas no Asana)</text>
<rect x="900" y="24" width="1" height="102" fill="#1f3354"/>
<text x="928" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#f2f4f7">−35–40%</text>
<text x="928" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#9aa4b2">custo de armazenamento</text>
<text x="928" y="121" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#9aa4b2">no S3 (ciclo de vida)</text>
</svg>
